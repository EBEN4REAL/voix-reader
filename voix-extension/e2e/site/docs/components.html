<!doctype html><html lang="en"><head><title>Component article</title></head><body>
<nav>Home Products Pricing</nav><story-card></story-card>
<script>
customElements.define('story-card', class extends HTMLElement {
  constructor() { super(); const r = this.attachShadow({mode:'open'});
    r.innerHTML = `<style>p{font:18px Georgia}</style><article><h1>Inside the Shadow</h1>
      <p>This article lives inside a web component, which many modern sites use for their content. Ordinary page scanning cannot see it, because the text sits inside a shadow root.</p>
      <p>Voix walks into shadow roots, so the article is read just like any other page. Highlighting follows along inside the component as each sentence is spoken.</p>
      <p>A third paragraph makes sure there is plenty of text to count as an article, so that the reader recognises it without being told where to look.</p>
      <p>And a fourth paragraph, for good measure, because real articles are rarely short and the detection rule wants several hundred characters.</p></article>`; }
});
</script></body></html>
